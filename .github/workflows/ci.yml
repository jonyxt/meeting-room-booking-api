name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_USER: booking_ci
      JWT_ALGORITHM: HS256
      JWT_EXP_DELTA_SECONDS: "3600"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate temporary secrets
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate Docker Compose
        run: |
          docker compose \
            -p booking-ci \
            --profile test \
            -f docker-compose.test.yml \
            config --quiet

      - name: Run unit and integration tests
        run: |
          docker compose \
            -p booking-ci \
            --profile test \
            -f docker-compose.test.yml \
            up --build \
            --abort-on-container-exit \
            --exit-code-from tests \
            tests

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            -p booking-ci \
            --profile test \
            -f docker-compose.test.yml \
            logs --no-color

      - name: Cleanup test infrastructure
        if: always()
        run: |
          docker compose \
            -p booking-ci \
            --profile test \
            -f docker-compose.test.yml \
            down -v --remove-orphans
